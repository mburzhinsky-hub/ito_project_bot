name: Native Windows
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            $text = [IO.File]::ReadAllText($_.FullName)
            if ($text -match '[^\x00-\x7F]') { throw "Non-ASCII PowerShell script" }
          }
      - name: Install and check imports
        shell: powershell
        run: |
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q app scripts/configure-native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import app.main; from zoneinfo import ZoneInfo; ZoneInfo('Europe/Moscow')"
          exit $LASTEXITCODE
      - name: Build standalone ZIP
        run: python scripts/build-installer.py
      - name: Test isolated CMD on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ITO-BOT-WINDOWS
          path: dist/ITO_BOT_WINDOWS.zip
