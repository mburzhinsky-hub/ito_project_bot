[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-project-assistant"
version = "0.1.0"
description = "Telegram project memory bot: tasks, unanswered questions, digests and reminders"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "openai>=2.0,<3",
  "APScheduler>=3.10,<4",
  "python-dateutil>=2.9,<3",
  "tenacity>=9,<10",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
